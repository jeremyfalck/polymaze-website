name: Deploy to OVH on push to main
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci && npm run build
        env:
          CI: false
      - name: Upload build to OVH over SFTP
        env:
          FTP_HOST: ${{ secrets.OVH_FTP_HOST }}
          FTP_USER: ${{ secrets.OVH_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.OVH_FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp
          lftp -u "$FTP_USER","$FTP_PASSWORD" -e "set sftp:auto-confirm yes; set net:max-retries 3; mirror -R --delete --verbose build www; bye" sftp://"$FTP_HOST":22
